name: companion

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}"
    volumes:
      - companion-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U companion -d companion"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped
    networks:
      companion-internal:
        ipv4_address: 172.29.255.5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Database__Provider: PostgreSql
      ConnectionStrings__Companion: Host=postgres;Port=5432;Database=companion;Username=companion;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      Admin__AccessKey: ${ADMIN_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:5252:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    networks:
      companion-internal:
        ipv4_address: 172.29.255.4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3636:80"
    networks:
      companion-internal:
        ipv4_address: 172.29.255.2
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  companion-pg-data:

networks:
  companion-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.255.0/24
