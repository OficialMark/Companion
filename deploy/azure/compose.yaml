name: companion-azure

services:
  api:
    build:
      context: ../../backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: PostgreSql
      ConnectionStrings__Companion: ${COMPANION_POSTGRES_TARGET:?Configure a conexão PostgreSQL}
      Admin__AccessKey: ${ADMIN_ACCESS_KEY:?Configure a chave administrativa}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [app]

  frontend:
    build:
      context: ../../frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [frontend]
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 172.29.255.2

  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Configure o token do Cloudflare Tunnel}
    depends_on: [proxy]
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 172.29.255.6

networks:
  app:
    ipam:
      config:
        - subnet: 172.29.255.0/24
          ip_range: 172.29.255.128/25
